# docker-compose.yml — Local development + production deployment
# ================================================================
# Usage:
#   Local dev (hot reload):  docker compose up api-dev
#   Production (gunicorn):   docker compose up api
#   Both:                    docker compose up

services:
  # --- Production service (gunicorn + uvicorn workers) ---
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=${WORKERS:-2}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ARTIFACT_STORE=/app/artifacts
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - DIARIZATION_MODEL=${DIARIZATION_MODEL:-pyannote/speaker-diarization-3.1}
      - HF_TOKEN=${HF_TOKEN:-}
      - PIPELINE_TIMEOUT=${PIPELINE_TIMEOUT:-7200}
    volumes:
      - artifact_data:/app/artifacts
      - hf_cache:/home/highlight/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --- Development service (uvicorn with hot reload) ---
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=DEBUG
      - RELOAD=true
      - ARTIFACT_STORE=/app/artifacts
      - CORS_ORIGINS=*
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - DIARIZATION_MODEL=${DIARIZATION_MODEL:-pyannote/speaker-diarization-3.1}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./scripts:/app/scripts
      - artifact_data:/app/artifacts
    command: >
      uvicorn highlight_extractor.api.app:app
      --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/src
      --log-level debug
    restart: unless-stopped

volumes:
  artifact_data:
    driver: local
  hf_cache:
    driver: local
