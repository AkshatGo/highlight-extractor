# deploy/docker-compose.prod.yml — Production deployment
# ========================================================
# Usage:
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# Requirements:
#   - GPU runtime: nvidia-docker2 or Docker Desktop with GPU support
#   - NVIDIA driver installed on host

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: production
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=${WORKERS:-2}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ARTIFACT_STORE=/app/artifacts
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - PIPELINE_TIMEOUT=${PIPELINE_TIMEOUT:-7200}
    volumes:
      - artifact_data:/app/artifacts
      - model_cache:/root/.cache/huggingface
      - model_cache_whisper:/root/.cache/whisper
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  artifact_data:
    driver: local
  model_cache:
    driver: local
  model_cache_whisper:
    driver: local
