# Per-show keyword presets for highlight extraction.
# Each preset defines keywords that signal highlight-worthy moments
# for a specific show type or genre.
#
# Usage:
#   Set KEYWORD_PRESET=<name> in .env or pass via API
#   Or provide custom keywords per job via the API

# Default: general podcast keywords
default:
  - but
  - wow
  - amazing
  - wait
  - seriously
  - incredible
  - unbelievable
  - shocking
  - hilarious
  - exactly
  - right
  - absolutely
  - definitely
  - literally
  - honestly
  - problem
  - solution
  - secret
  - truth
  - mistake

